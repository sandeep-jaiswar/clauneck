[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clauneck-engine"
version = "0.1.0"
description = "Deterministic scientific prototyping engine: symbolic and numeric solving"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "sympy>=1.12",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
