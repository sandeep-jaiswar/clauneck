<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clauneck — Scientific Prototyping Platform</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .query-panel {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 0.6s ease;
        }

        .query-panel label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1e3c72;
        }

        .query-input-group {
            display: flex;
            gap: 10px;
        }

        .query-panel textarea {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
            transition: border-color 0.3s;
        }

        .query-panel textarea:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(42, 82, 152, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            color: white;
            font-size: 1.1em;
            margin: 20px 0;
            animation: pulse 1.5s infinite;
        }

        .loading.active {
            display: block;
        }

        .error-panel {
            background: #fee;
            border-left: 4px solid #e74c3c;
            padding: 20px;
            border-radius: 6px;
            color: #c0392b;
            margin-bottom: 20px;
            display: none;
            animation: slideInDown 0.3s ease;
        }

        .error-panel.active {
            display: block;
        }

        .error-panel h3 {
            margin-bottom: 10px;
        }

        .results-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .result-panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 0.6s ease;
            display: none;
        }

        .result-panel.active {
            display: block;
        }

        .result-panel h2 {
            color: #1e3c72;
            margin-bottom: 15px;
            font-size: 1.4em;
            border-bottom: 2px solid #2a5298;
            padding-bottom: 10px;
        }

        .model-section {
            margin-bottom: 20px;
        }

        .model-section h3 {
            color: #2a5298;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .quantity-list, .equation-list, .summary-list {
            list-style: none;
        }

        .quantity-list li, .equation-list li, .summary-list li {
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .quantity-list li:last-child, .equation-list li:last-child, .summary-list li:last-child {
            border-bottom: none;
        }

        .quantity-name {
            font-weight: 600;
            color: #1e3c72;
        }

        .quantity-value {
            color: #666;
            font-size: 0.95em;
        }

        .chart-container {
            position: relative;
            height: 350px;
            margin-bottom: 20px;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .export-btn {
            padding: 10px 16px;
            font-size: 0.9em;
            background: #27ae60;
        }

        .export-btn:hover {
            background: #229954;
        }

        .success-message {
            background: #eafbea;
            color: #27ae60;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
        }

        .success-message.active {
            display: block;
            animation: slideInDown 0.3s ease;
        }

        .grid-full {
            grid-column: 1 / -1;
        }

        .metadata {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-button {
            padding: 12px 24px;
            background: transparent;
            color: #666;
            border: none;
            border-radius: 0;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: color 0.3s, border-color 0.3s;
        }

        .tab-button:hover {
            color: #2a5298;
            transform: none;
            box-shadow: none;
        }

        .tab-button.active {
            color: #2a5298;
            border-bottom-color: #2a5298;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            background: white;
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: box-shadow 0.3s, transform 0.2s;
        }

        .history-item:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 8px;
        }

        .history-item-query {
            flex: 1;
            font-weight: 600;
            color: #1e3c72;
            word-break: break-word;
        }

        .history-item-meta {
            display: flex;
            gap: 12px;
            font-size: 0.85em;
            color: #999;
            margin-top: 8px;
        }

        .history-domain {
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 3px;
            color: #666;
        }

        .history-status {
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: 600;
        }

        .history-status.success {
            background: #d4edda;
            color: #155724;
        }

        .history-status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .history-empty {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .results-container {
                grid-template-columns: 1fr;
            }

            .query-input-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧪 Clauneck</h1>
            <p>Deterministic Scientific Prototyping Platform</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('solver')">🔬 Solver</button>
            <button class="tab-button" onclick="switchTab('history')">📚 History</button>
        </div>

        <!-- Solver Tab -->
        <div id="solver-tab" class="tab-content active">
        <div class="query-panel">
            <label for="query">Describe your scientific scenario:</label>
            <div class="query-input-group">
                <textarea id="query" placeholder="Example: Ball at 10 m/s, 30 degrees, 1 kg mass. Calculate trajectory." spellcheck="false"></textarea>
                <button id="solveBtn" onclick="solveQuery()">Solve</button>
            </div>
        </div>

        <div class="loading" id="loading">
            ⏳ Translating and solving your query...
        </div>

        <div class="error-panel" id="errorPanel">
            <h3>Error</h3>
            <p id="errorMessage"></p>
        </div>

        <div class="success-message" id="successMessage"></div>

        <div class="results-container" id="resultsContainer">
            <!-- Model Panel -->
            <div class="result-panel" id="modelPanel">
                <h2>📋 Model</h2>
                <div class="metadata">
                    <strong>Domain:</strong> <span id="domain"></span> |
                    <strong>Description:</strong> <span id="description"></span>
                </div>
                <div class="model-section">
                    <h3>Quantities</h3>
                    <ul class="quantity-list" id="quantitiesList"></ul>
                </div>
                <div class="model-section">
                    <h3>Equations</h3>
                    <ul class="equation-list" id="equationsList"></ul>
                </div>
                <div class="model-section">
                    <h3>Initial Conditions</h3>
                    <ul class="quantity-list" id="icList"></ul>
                </div>
            </div>

            <!-- Result Panel -->
            <div class="result-panel" id="resultPanel">
                <h2>✅ Results</h2>
                <div class="model-section">
                    <h3>Summary</h3>
                    <ul class="summary-list" id="summaryList"></ul>
                </div>
                <div class="model-section" id="chartSection" style="display: none;">
                    <h3>Trajectory</h3>
                    <div class="chart-container">
                        <canvas id="trajectoryChart"></canvas>
                    </div>
                    <div class="export-buttons">
                        <button class="export-btn" onclick="exportCSV()">📥 Export CSV</button>
                        <button class="export-btn" onclick="exportPNG()">📸 Export PNG</button>
                    </div>
                </div>
            </div>
        </div>
        </div>
        <!-- End Solver Tab -->

        <!-- History Tab -->
        <div id="history-tab" class="tab-content">
            <div class="history-list" id="historyList">
                <div class="history-empty">Loading history...</div>
            </div>
        </div>
        <!-- End History Tab -->

    </div>

    <script src="app.js"></script>
</body>
</html>
