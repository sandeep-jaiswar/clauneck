plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.4'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

// Shared schema contract lives at repo root (schemas/), not duplicated into
// web/src/main/resources — this puts it on the classpath as-is.
sourceSets {
    main {
        resources {
            srcDirs += ['../schemas']
        }
    }
}

dependencies {
    implementation project(':core')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.xerial:sqlite-jdbc:3.45.0.0'
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.2.20.Final'
    implementation 'com.networknt:json-schema-validator:1.0.88'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    mainClass = 'com.clauneck.web.ClauneckWebApplication'
}